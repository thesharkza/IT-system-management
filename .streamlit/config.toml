[theme]
base = "dark"
primaryColor = "#1E6FD9"
backgroundColor = "#0B1829"
secondaryBackgroundColor = "#112240"
textColor = "#E8EDF5"
font = "sans serif"

[client]
# viewer = ซ่อน toolbar นักพัฒนา แต่ยังแสดงปุ่ม sidebar collapse
# (อย่าใช้ "minimal" เพราะจะซ่อน header ทั้งหมดรวมปุ่มเปิด sidebar)
toolbarMode = "viewer"
showSidebarNavigation = true

[browser]
gatherUsageStats = false
